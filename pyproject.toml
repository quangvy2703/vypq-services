[project]
name = "vypq-services"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv.workspace]
members = ["packages/*", "apps/*", "services/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.7",
    "vypq-contracts",
    "asgi-lifespan>=2.1",
    "vypq-core",
    # <<< workspace members
]

[tool.uv.sources]
vypq-contracts = { workspace = true }
vypq-core = { workspace = true }
# <<< workspace sources

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
