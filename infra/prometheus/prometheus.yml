global: {scrape_interval: 15s}
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: gateway
    static_configs: [{targets: ["gateway:8080"]}]
  - job_name: services
    static_configs: [{targets: ["ocr:8001", "asr:8002"]}]
  # Redpanda v24.2.7 KHÔNG phát metric lag của consumer group — đã kiểm cả
  # /public_metrics lẫn /metrics trên broker thật, không series nào khớp "lag".
  # Muốn có lag thì tính bằng PromQL từ hai gauge sẵn có:
  #   redpanda_kafka_max_offset - redpanda_kafka_consumer_group_committed_offset
  # join theo topic/partition/group. Kiểm bằng query thật trước khi đặt ngưỡng.
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs: [{targets: ["redpanda:9644"]}]
