services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      # Hai listener chứ không một. Một listener quảng bá "localhost:9092" chỉ
      # đúng cho client chạy trên máy chủ; container trong cùng network nhận
      # metadata đó rồi nối vào CHÍNH NÓ và nhận Connection refused. Giữ
      # external ở 9092 để dev và test trên máy chủ không phải đổi gì, thêm
      # internal ở 9093 cho các container gọi nhau bằng tên service.
      - --kafka-addr internal://0.0.0.0:9093,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:9093,external://localhost:9092
    ports: ["9092:9092", "9644:9644"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      retries: 20

  redpanda-console:
    image: redpandadata/console:v2.7.2
    environment:
      # 9093 là listener nội bộ. Cổng 9092 quảng bá "localhost", đúng cho client
      # trên máy chủ nhưng trỏ ngược vào chính container khi gọi từ trong network.
      KAFKA_BROKERS: redpanda:9093
    ports: ["8090:8080"]
    depends_on: [redpanda]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vypq
      POSTGRES_PASSWORD: vypq
      POSTGRES_DB: vypq
    # Không có volume thì dữ liệu nằm trong lớp ghi của container và "compose
    # down" xoá sạch lịch sử chạy — mất im lặng, vì container mới vẫn lên bình
    # thường và chỉ trống rỗng.
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vypq"]
      interval: 5s
      retries: 20

  gateway:
    build: {context: ../.., dockerfile: apps/gateway/Dockerfile}
    environment:
      VYPQ_DATABASE_URL: postgresql+asyncpg://vypq:vypq@postgres:5432/vypq
      VYPQ_BROKERS: redpanda:9093
      # Bắt buộc, giống model-host: gateway từ chối khởi động nếu thiếu — xem
      # GatewaySettings._token_must_not_be_empty.
      VYPQ_TOKEN: ${VYPQ_TOKEN:?bat buoc dat VYPQ_TOKEN}
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}

  ocr:
    build: {context: ../.., dockerfile: services/ocr/Dockerfile}
    environment:
      # Service hỏi gateway danh sách máy GPU đang thuê qua
      # /v1/discovery/hosts — đường đó mang token nên phải xác thực.
      VYPQ_GATEWAY_TOKEN: ${VYPQ_TOKEN:?bat buoc dat VYPQ_TOKEN}
      VYPQ_BROKERS: redpanda:9093
    ports: ["8001:8001"]
    depends_on:
      redpanda: {condition: service_healthy}

  asr:
    build: {context: ../.., dockerfile: services/asr/Dockerfile}
    environment:
      VYPQ_GATEWAY_TOKEN: ${VYPQ_TOKEN:?bat buoc dat VYPQ_TOKEN}
      VYPQ_BROKERS: redpanda:9093
    ports: ["8002:8002"]
    depends_on:
      redpanda: {condition: service_healthy}

  dashboard:
    build: {context: ../../apps/dashboard, dockerfile: Dockerfile}
    environment:
      GATEWAY_URL: http://gateway:8080
      # Phải trùng token của gateway — dashboard là client có xác thực của nó.
      GATEWAY_TOKEN: ${VYPQ_TOKEN:?bat buoc dat VYPQ_TOKEN}
      # Bắt buộc, cùng lập trường với VYPQ_TOKEN: dashboard là proxy vào gateway,
      # chạy không mật khẩu nghĩa là mở toàn bộ token máy GPU ra cổng 3001.
      # "off" bỏ hẳn cổng mật khẩu. Chỉ dùng khi cổng 3001 không ai ngoài với
      # tới được: dashboard cầm GATEWAY_TOKEN, mà token đó đọc được endpoint
      # discovery của gateway — nơi chứa token của mọi máy GPU đang thuê.
      DASHBOARD_AUTH: ${DASHBOARD_AUTH:-on}
      # Bỏ trống được khi DASHBOARD_AUTH=off; ngoài ra là bắt buộc.
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
    # Cổng 3000 đã là Grafana.
    ports: ["3001:3001"]
    depends_on: [gateway]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    depends_on: [redpanda]

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: vypq
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
