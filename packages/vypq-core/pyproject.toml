[project]
name = "vypq-core"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vypq-contracts",
    "fastapi>=0.115",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vypq_core"]

[tool.uv.sources]
vypq-contracts = { workspace = true }
