[pytest]
testpaths = tests packages services apps
asyncio_mode = auto
markers =
    slow: cần GPU hoặc dịch vụ ngoài, không chạy mặc định
addopts = -m "not slow" --strict-markers --import-mode=importlib
# _template chứa token __XXX__ chưa thay thế nên test của nó (nếu chạy trực
# tiếp) sẽ import lỗi — loại khỏi thu thập test tự động toàn repo.
norecursedirs = .git .venv venv build dist _template
